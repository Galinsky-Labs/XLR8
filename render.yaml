# Render blueprint documenting the deployed service (created through the Render API).
services:
  - type: web
    runtime: node
    name: xlr8
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Neon project "xlr8", pooled host
        sync: false
      - key: MIGRATION_DATABASE_URL # Neon project "xlr8", direct host
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://xlr8.onrender.com
